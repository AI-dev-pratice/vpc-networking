name: OpenTofu Infrastructure Apply (AWS)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build (Plan) - dev
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'dev' }}
    uses: AI-dev-pratice/.github/.github/workflows/opentofu-aws-reusable.yaml@main
    with:
      working_directory: "./"  
      tofu_version: "latest"
      apply_on_main: false
      run_plan: true
      #action: plan
      environment: dev
      runner: ""
      container_image: "ubuntu-latest"
      aws_iam_role: ${{ vars.AWS_IAM_ROLE }}
    secrets: inherit

  deploy:
    name: Deploy (Apply) - dev
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'dev') }}
    uses: AI-dev-pratice/.github/.github/workflows/opentofu-aws-reusable.yaml@main
    with:
      working_directory: "./"  
      tofu_version: "latest"
      apply_on_main: true
      run_plan: false
      #action: plan
      environment: dev
      runner: ""
      container_image: "ubuntu-latest"
      aws_iam_role: ${{ vars.AWS_IAM_ROLE }}
    secrets: inherit

