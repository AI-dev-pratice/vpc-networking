name: OpenTofu Infrastructure Apply (AWS)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  dev:
    name: Dev
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'dev' }}
    uses: ./.github/workflows/opentofu-aws-reusable.yaml
    with:
      environment: dev
      working_directory: "./"
      tofu_version: "1.9.8"
      aws_iam_role: ${{ vars.AWS_IAM_ROLE }}
      runner: "ubuntu-latest"
      run_plan: true
      apply_on_main: true

